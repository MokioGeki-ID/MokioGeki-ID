<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="MokioGeki, Junior Fullstack Developer dari Indonesia. Membangun aplikasi web dari tampilan di browser sampai server dan database, terutama untuk belajar dan pendidikan. Sedang memperdalam JWT, bcrypt, Row Level Security, dan SQL. Bisa ditanya soal React dan Vite, REST API dengan Node.js dan Express, Supabase dan PostgreSQL, Git dan GitHub, serta website untuk belajar dan sekolah.">
